[package]
name = "klarity-exhibit-04-us-core-medication-request"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "US Core MedicationRequest checks for FHIR R4"
publish = false

[lib]
name = "us_core_medication_request"
path = "src/lib.rs"

[[bin]]
name = "validate-medication-request"
path = "src/bin/validate_medication_request.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
